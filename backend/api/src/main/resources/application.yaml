spring:
  datasource:
    url: jdbc:sqlserver://localhost:${DB_PORT:1433};databaseName=${DB_NAME:QueenKhoDB};encrypt=true;trustServerCertificate=true;
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # BR-117: SMTP gửi email cho khách. Gmail: bật xác minh 2 bước → tạo "Mật khẩu ứng dụng" làm MAIL_PASSWORD
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

server:
  port: 8080

vnpay:
  tmn-code: 83NI8FOK
  hash-secret: YFFJDENNWNIZZYNWLPCRWZFNIKCGEYDQ
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
  frontend-url: ${VNPAY_FRONTEND_URL:http://localhost:5173}
  local-return-confirm: ${VNPAY_LOCAL_RETURN_CONFIRM:true}

queenkho:
  # Nút "⚡ Giả lập" tua thời gian để demo (DemoSimulationService). Tắt khi chạy thật: SIMULATION_ENABLED=false
  simulation:
    enabled: ${SIMULATION_ENABLED:true}
  # BR-117: false = chỉ in nội dung email ra console (máy chưa cấu hình SMTP vẫn chạy). Bật: MAIL_ENABLED=true
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:QueenKho <no-reply@queenkho.local>}
