services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "12345678@Password"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '12345678@Password' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql_script:/scripts
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /scripts/init_db.sh | /bin/bash"]
    restart: "no"

  backend:
    build: ./backend/api
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=sa
      - DB_PASSWORD=12345678@Password
      - DB_NAME=QueenKhoDB
      - DB_PORT=1433
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=QueenKhoDB;encrypt=true;trustServerCertificate=true;
      - VNPAY_TMN_CODE=83NI8FOK
      - VNPAY_HASH_SECRET=YFFJDENNWNIZZYNWLPCRWZFNIKCGEYDQ
      - VNPAY_LOCAL_RETURN_CONFIRM=true
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  sql_data: