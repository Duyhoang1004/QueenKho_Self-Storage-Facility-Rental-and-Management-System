services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    user: root
    environment:
      ACCEPT_EULA: "Y"
      TZ: Asia/Ho_Chi_Minh
      MSSQL_SA_PASSWORD: "12345678@Password"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      TZ: Asia/Ho_Chi_Minh
      MSSQL_SA_PASSWORD: "12345678@Password"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql_script:/scripts:ro
    entrypoint: ["/bin/bash", "-o", "pipefail", "-c", "tr -d '\\r' < /scripts/init_db.sh | /bin/bash"]
    restart: "no"

  backend:
    build: ./backend/api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - DB_USERNAME=sa
      - DB_PASSWORD=12345678@Password
      - DB_NAME=QueenKhoDB
      - DB_PORT=1433
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=QueenKhoDB;encrypt=true;trustServerCertificate=true;
      - VNPAY_TMN_CODE=83NI8FOK
      - VNPAY_HASH_SECRET=YFFJDENNWNIZZYNWLPCRWZFNIKCGEYDQ
      - VNPAY_LOCAL_RETURN_CONFIRM=true
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sql_data:
