spring:
  datasource:
    # Cú pháp kết nối chuẩn cho SQL Server
    url: jdbc:sqlserver://localhost:1433;databaseName=queenkho_db;encrypt=true;trustServerCertificate=true;
    username: sa               # Tài khoản đăng nhập SQL Server của bạn (mặc định là sa)
    password: MatKhauCuaBan    # Mật khẩu tài khoản sa của bạn
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  
  jpa:
    hibernate:
      ddl-auto: update         # Tự động tạo bảng từ Entity khi chạy app
    show-sql: true             # In các câu lệnh SQL ra terminal để dễ debug
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

server:
  port: 8080